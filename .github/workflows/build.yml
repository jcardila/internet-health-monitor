# Compila y prueba en cada cambio. Con una etiqueta v* (p. ej. v2.0.1) además crea el instalador
# de Velopack y lo publica como release de GitHub.
name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pruebas del núcleo
        run: dotnet run --project tests/InternetHealth.Core.Tests -c Release

      - name: Compilar la app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet build src/InternetHealth.App/InternetHealth.App.csproj -c Release -nologo

      - name: Instalador y paquetes de actualización
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./build/build.ps1 -Version $version -Pack -SkipTests

      - name: Guardar artefactos
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: releases
          path: artifacts/releases/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/releases/*
          draft: true
